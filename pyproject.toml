[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-vla"
version = "0.1.0"
description = "Residual SAC and PPO around a frozen OpenPI policy"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<2", "torch>=2.7,<3", "gymnasium>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
rl-vla = "rl_vla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
