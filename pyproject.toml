[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-vla"
version = "0.1.0"
description = "Residual SAC/PPO and RLDT flow-policy fine-tuning for OpenPI"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<2", "torch>=2.7,<3", "gymnasium>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "pyyaml>=6,<7"]
rldt = ["jax==0.5.3", "flax==0.10.2", "optax==0.2.4"]

[project.scripts]
rl-vla = "rl_vla.cli:main"
rl-vla-rldt = "rl_vla.rldt:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
