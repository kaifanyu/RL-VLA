# Optional LIBERO reference task. See docs/libero.md for simulator setup.
# pi05_libero uses H=10, D=7. These bounds are examples in controller units.
algorithm = "sac"

[env]
kind = "external"
factory = "rl_vla.envs.libero:make_env"
[env.kwargs]
task_suite = "libero_spatial"
task_id = 0
max_steps = 220
# Put task ID, asset location, controller and domain split here.

[base]
kind = "openpi"
host = "localhost"
port = 8000
# Declared provenance; the standard server does not verify these fields.
checkpoint_id = "gs://openpi-assets/checkpoints/pi05_libero"
model_config = "pi05_libero"
source_commit = "215abfb217dbac7d5f1273282331b9b1866c0479"

[chunk]
horizon = 10
execute_steps = 5
gamma = 0.99
# xyz, rotation-vector deltas, gripper. Zero keeps base gripper unchanged.
residual_scale = [0.05, 0.05, 0.05, 0.025, 0.025, 0.025, 0.0]
# Set fixed state_mean and state_std here if state needs scaling.

[train]
seed = 0
device = "cpu"
torch_threads = 1
total_decisions = 10000
batch_size = 256
learning_starts = 256
replay_capacity = 100000
updates_per_decision = 1
log_every = 100
save_every = 1000

[sac]
hidden_dim = 256
actor_lr = 0.0001
critic_lr = 0.0003
alpha_lr = 0.0003
initial_alpha = 0.1
tau = 0.005
