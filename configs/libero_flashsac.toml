# Optional LIBERO reference task. See docs/libero.md for simulator setup.
# pi05_libero uses H=10, D=7. These bounds are examples in controller units.
algorithm = "flashsac"

[env]
kind = "external"
factory = "rl_vla.envs.libero:make_env"
[env.kwargs]
task_suite = "libero_spatial"
task_id = 5
max_steps = 220
# Put task ID, asset location, controller and domain split here.

[base]
kind = "openpi"
host = "localhost"
port = 8002
# Declared provenance; the standard server does not verify these fields.
checkpoint_id = "gs://openpi-assets/checkpoints/pi05_libero"
model_config = "pi05_libero"
source_commit = "215abfb217dbac7d5f1273282331b9b1866c0479"

[chunk]
horizon = 10
execute_steps = 5
gamma = 0.99
# xyz, rotation-vector deltas, gripper. Zero keeps base gripper unchanged.
residual_scale = [0.05, 0.05, 0.05, 0.025, 0.025, 0.025, 0.0]
# Set fixed state_mean and state_std here if state needs scaling.

[train]
seed = 0
device = "cpu"
torch_threads = 1
total_decisions = 10000
batch_size = 256
learning_starts = 256
replay_capacity = 100000
updates_per_decision = 1
log_every = 100
save_every = 1000

[flashsac]
# FlashSAC networks, single-environment regime (upstream: batch 512, UTD 1).
# [train].batch_size and updates_per_decision above control batch and UTD.
actor_num_blocks = 2
actor_hidden_dim = 128
critic_num_blocks = 2
critic_hidden_dim = 256
critic_num_bins = 101
normalized_g_max = 5.0
normalize_reward = true
learning_rate = 0.0003
learning_rate_end = 0.00015
lr_decay_updates = 10000      # Set to total_decisions * updates_per_decision.
tau = 0.01
actor_update_period = 2
initial_temperature = 0.01
target_sigma = 0.05
initial_log_std = -3.0
