algorithm = "flashsac"

[env]
kind = "toy"
[env.kwargs]
max_steps = 60
shaping_scale = 0.1

[base]
kind = "mock"

[chunk]
horizon = 10
execute_steps = 5
gamma = 0.99
residual_scale = 0.2

[train]
seed = 0
device = "cpu"
torch_threads = 1
total_decisions = 2000
batch_size = 64
learning_starts = 64
replay_capacity = 10000
updates_per_decision = 1
log_every = 100
save_every = 1000

[flashsac]
# Upstream single-environment (CPU-simulator) settings scaled to the toy.
actor_num_blocks = 2
actor_hidden_dim = 128
critic_num_blocks = 2
critic_hidden_dim = 256
critic_num_bins = 101
normalized_g_max = 5.0        # Categorical support is [-5, 5] after reward scaling.
normalize_reward = true
learning_rate = 0.0003
learning_rate_end = 0.00015
lr_decay_updates = 2000       # Cosine decay length; 0 keeps the rate constant.
tau = 0.01
actor_update_period = 2
initial_temperature = 0.01
target_sigma = 0.05           # Entropy target in normalized residual units (~exp(-3)).
initial_log_std = -3.0
